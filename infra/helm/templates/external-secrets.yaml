apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shielddesk-external-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: shielddesk-secrets
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: shielddesk/prod/database
        property: connection_string
    - secretKey: jwt_secret
      remoteRef:
        key: shielddesk/prod/iam
        property: jwt_secret
    - secretKey: anthropic_api_key
      remoteRef:
        key: shielddesk/prod/ai
        property: anthropic_key
