_format_version: "3.0"

services:
  - name: iam-service
    url: http://shielddesk-iam:4000
    routes:
      - name: auth-routes
        paths:
          - /v1/auth
        strip_path: false

  - name: scan-service
    url: http://shielddesk-scan:8001
    routes:
      - name: scan-routes
        paths:
          - /v1/scans
          - /v1/secrets
          - /v1/vulnerabilities
        strip_path: false

  - name: ai-advisor-service
    url: http://shielddesk-ai-advisor:8002
    routes:
      - name: ai-routes
        paths:
          - /v1/ai
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 120
      policy: redis
      redis_host: shielddesk-redis
      redis_port: 6379

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-ShieldDesk-Signature
      credentials: true
