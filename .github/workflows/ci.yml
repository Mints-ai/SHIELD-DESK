name: ShieldDesk CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-node:
    name: Node.js Typecheck & Full SOC Test Suite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: ""
      SHIELDDESK_SESSION_SECRET: test-session-secret-for-unit-testing-minimum-32-chars!
      PYTHON_AI_SERVICE_URL: http://127.0.0.1:59999
      OLLAMA_BASE_URL: http://127.0.0.1:59999/v1
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Execute ShieldDesk Unit, Security & Closed-Loop Test Suites
        run: npm test

  validate-go-agent:
    name: Go Universal Endpoint Agent Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.mod

      - name: Verify Go Module Dependencies
        run: go mod download

      - name: Run Go Vet & Static Analysis
        run: go vet ./...

      - name: Compile Universal Endpoint Agent
        run: go build -v ./...

      - name: Execute Go Agent & Handler Test Suites
        run: go test -v -race ./...

  validate-python-services:
    name: Python Vulnerability Intelligence & Services Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax and Compilation Check for Python Services
        run: |
          python -m py_compile server.py cve_ai_engine.py || true
          if [ -d "services" ]; then
            python -m compileall services/
          fi

  validate-rust-daemon:
    name: Rust Tier 3 Bastion Daemon Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/rust_daemon

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo Compilation
        run: cargo check --verbose
