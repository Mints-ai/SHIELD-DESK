syntax = "proto3";

package shielddesk.ingest.v1;

option go_package = "shielddesk/shared/proto/v1;ingestv1";

// AgentEvent represents a single endpoint security telemetry event.
message AgentEvent {
  string tenant_id = 1;
  string asset_id = 2;
  string event_type = 3;  // process | file | network | auth | inventory
  int64 timestamp = 4;    // Epoch millisecond timestamp (UTC)
  map<string, string> payload = 5;
  string agent_version = 6;
}

// Ack is the acknowledgment message returned back to the sending agent.
message Ack {
  bool success = 1;
  string event_id = 2;
  bool backpressure = 3;      // Signals agent to throttle event emissions
  bool rate_limited = 4;      // True if tenant rate limit exceeded
  int64 next_retry_ms = 5;    // Backoff delay if retry required
  string error_message = 6;
}

// HandshakeRequest initializes an authenticated agent session via mTLS.
message HandshakeRequest {
  string tenant_id = 1;
  string agent_id = 2;
  string hostname = 3;
  string os_type = 4;         // linux | windows | darwin
  string agent_version = 5;
  string client_cert_fingerprint = 6;
}

// HandshakeResponse delivers enrollment status and operating parameters.
message HandshakeResponse {
  bool authorized = 1;
  string tenant_id = 2;
  int32 heartbeat_interval_sec = 3;
  string session_token = 4;
  string error_message = 5;
}

// IngestService handles high-throughput agent telemetry ingestion.
service IngestService {
  // Bidirectional streaming endpoint for sending batches of security events.
  rpc SendEvents(stream AgentEvent) returns (stream Ack);

  // Unary handshake for verifying agent enrollment and TLS credentials.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
}
