syntax = "proto3";

package shielddesk.agent.v1;

option go_package = "shielddesk/shared/proto/v1;agentv1";

// HeartbeatPing sent periodically by enrolled agent
message HeartbeatPing {
  string tenant_id = 1;
  string agent_id = 2;
  string hostname = 3;
  string os_type = 4;
  string agent_version = 5;
  int64 timestamp = 6;
  double cpu_usage_pct = 7;
  double memory_usage_pct = 8;
  int32 process_count = 9;
  int32 network_connection_count = 10;
  string client_cert_fingerprint = 11;
}

// HeartbeatPong returned by control plane to agent
message HeartbeatPong {
  bool acknowledged = 1;
  int64 timestamp = 2;
  int32 next_interval_sec = 3;
  bool kill_switch_engaged = 4;  // If true, agent immediately freezes command execution
  bool certificate_renewal_needed = 5;
}

// AgentCommand represents a cryptographically-signed instruction from the control plane
message AgentCommand {
  string command_id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string tier = 4; // Tier 1 | Tier 2 | Tier 3
  string command = 5; // take_safety_snapshot | isolate_host | kill_process | block_ip | rollback
  map<string, string> arguments = 6;
  string approval_token_id = 7;
  int64 issued_at = 8;
  int64 expires_at = 9;
  string nonce = 10;
  string signature = 11; // RSA-SHA256 signature generated by control plane
}

// CommandResult streamed back by agent after executing or rejecting command
message CommandResult {
  string command_id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string status = 4; // success | failed | rejected_by_policy | rollback_triggered
  string execution_output = 5;
  string error_message = 6;
  int64 executed_at = 7;
  int64 duration_ms = 8;
  string snapshot_id = 9;
  string result_hash = 10; // SHA-256 digest of result for audit chain
}

// AgentService manages live bidirectional control & streaming
service AgentService {
  // Bidirectional heartbeat stream: ping/pong with emergency kill-switch delivery
  rpc StreamHeartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);

  // Command stream: Agent receives signed commands and reports execution progress & results
  rpc StreamCommands(stream CommandResult) returns (stream AgentCommand);
}
