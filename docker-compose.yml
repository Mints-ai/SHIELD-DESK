version: "3.8"

services:
  # 1. Next.js 15 Security Gateway & Operations Console
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shielddesk-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://shielddesk:shielddesk@db:5432/shielddesk
      - PYTHON_AI_SERVICE_URL=http://cve-engine:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_MODEL=qwen3:4b
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      cve-engine:
        condition: service_started
    networks:
      - shielddesk-network

  # 2. Python Vulnerability Intelligence Microservice (Port 8000)
  cve-engine:
    build:
      context: ./services/scan
      dockerfile: Dockerfile
    container_name: shielddesk-cve-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - shielddesk-network

  # 3. PostgreSQL Multi-Tenant Database (Port 5432)
  db:
    image: postgres:16-alpine
    container_name: shielddesk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shielddesk}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shielddesk}
      - POSTGRES_DB=${POSTGRES_DB:-shielddesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shielddesk -d shielddesk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shielddesk-network

  # 4. Redis In-Memory Cache & Distributed Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: shielddesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shielddesk-network

networks:
  shielddesk-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
